<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student Portal{% endblock %} - MULE CLASSES</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .portal-nav {
            background-color: var(--primary-color, #1a1a2e);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }
        .portal-nav a {
            color: white;
            text-decoration: none;
            margin-left: 1rem;
            font-weight: 500;
        }
        .portal-nav a:hover {
            color: var(--accent-primary, #e94560);
        }
        .portal-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            min-height: 70vh;
        }
        .card {
            background: white;
            border-radius: 10px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 1.5rem;
        }
        .card-header {
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body style="background-color: #f4f7f6; color: #333;">
    <div class="portal-nav">
        <div class="logo" style="font-weight: 800; font-size: 1.5rem;">MULE CLASSES <span style="font-size: 1rem; font-weight: 400;">| Student Portal</span></div>
        <div class="nav-links" style="display: flex;">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('homework') }}">Homework</a>
            <a href="{{ url_for('attendance') }}">Attendance</a>
            <a href="{{ url_for('notes') }}">Notes</a>
            <a href="{{ url_for('marks') }}">Marks</a>
            <a href="{{ url_for('logout') }}" style="color: #ff6b6b;"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </div>
    
    <div class="portal-container">
        {% block content %}{% endblock %}
    </div>

    <footer style="text-align: center; padding: 2rem; background: #1a1a2e; color: white;">
        <p>&copy; 2026 MULE CLASSES. All rights reserved.</p>
    </footer>
</body>
</html>
